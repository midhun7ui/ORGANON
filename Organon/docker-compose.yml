
services:
  chroma:
    image: chromadb/chroma:1.4.1
    container_name: organon-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: organon-postgres
    environment:
      POSTGRES_USER: organon
      POSTGRES_PASSWORD: ${ORGANON_DB_PASSWORD:?Set ORGANON_DB_PASSWORD first}
      POSTGRES_DB: organon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organon -d organon"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chroma_data:
  postgres_data:
